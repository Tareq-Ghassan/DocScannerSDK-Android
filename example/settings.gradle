pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
        maven { url 'https://jitpack.io' }
    }
}
rootProject.name = "docscanner-android-example"
include ':app'
include ':docscanner-sdk'
project(':docscanner-sdk').projectDir = new File(settingsDir, '../docscanner-sdk')
