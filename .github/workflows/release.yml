name: Release Android SDK

# Tag this repo to publish. Flutter / iOS / other SDKs are not involved.
#   git tag 2.1.1 && git push origin 2.1.1
# JitPack artifact: com.github.Tareq-Ghassan:DocScannerSDK-Android:<tag>
# Also creates the GitHub Release (sidebar Latest). A tag alone does not.

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+'

jobs:
  github-release:
    name: GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true

  build:
    name: Assemble library
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Assemble release AAR
        run: ./gradlew :docscanner-sdk:assembleRelease --stacktrace

      - name: Trigger JitPack
        run: |
          TAG="${GITHUB_REF_NAME}"
          curl -fsSL \
            "https://jitpack.io/api/builds/com.github.Tareq-Ghassan/DocScannerSDK-Android/${TAG}" \
            || echo "::warning::JitPack trigger failed; open https://jitpack.io/#Tareq-Ghassan/DocScannerSDK-Android"
